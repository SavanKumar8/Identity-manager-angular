<div class="min-h-screen flex bg-slate-50 text-slate-900">
  <!-- Left Navigation Panel -->
  <aside class="w-64 shrink-0 bg-white border-r border-slate-200 flex flex-col">
    <div class="h-16 px-6 flex items-center border-b border-slate-200">
      <span class="text-lg font-bold tracking-tight text-slate-800">Identity Manager</span>
    </div>

    <nav class="flex-1 p-4 space-y-1">
      <a
        routerLink="/identities"
        routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold"
        routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold"
        class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
        >Identites</a
      >
      <a
        routerLink="/request-access"
        routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold"
        class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
        >Request Access</a
      >
      <a
        routerLink="/approvals"
        routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold"
        class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
        >Approvals</a
      >
      <a
        routerLink="/audit-log"
        routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold"
        class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
        >Audit Log</a
      >
    </nav>
  </aside>

  <!-- Right Main Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top Bar (Task 11 will go here) -->
    <header class="h-16 px-6 bg-white border-b border-slate-200 flex items-center justify-between">
      <h1 class="text-xl font-semibold text-slate-800">Identities</h1>

      <div class="flex items-center gap-2">
        <label for="role-select" class="text-sm font-medium text-slate-600">Viewing as</label>
        <select
          id="role-select"
          #roleSelected
          [value]="role()"
          (change)="changeUserRole(roleSelected.value)"
          class="px-3 py-1.5 text-sm bg-white border border-slate-300 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="Manager">Manager</option>
          <option value="Employee">Employee</option>
          <option value="Auditor">Auditor</option>
        </select>
      </div>
    </header>

    <!-- Routed Page Content -->
    <main class="flex-1 p-6 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
